<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visQL – Visual SQL Execution Engine</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- 1. HEADER -->
    <header class="app-header">
        <div class="logo-container">
            <h1>🔍 visQL</h1>
            <span class="badge">Umschulungs-Projekt</span>
        </div>
        <p class="subtitle">Interaktive Visualisierung der Logical Query Processing Order in SQL</p>
    </header>

    <main class="app-container">

        <!-- 2. FIXED SQL CODE DISPLAY -->
        <section class="card code-card-fixed">
            <div class="code-header">
                <h2>📜 Aktuelle SQL-Abfrage</h2>
                <div class="controls-group">
                    <button id="btnPrev" class="btn btn-secondary" disabled>⏮ Zurück</button>
                    <button id="btnNext" class="btn btn-primary">Starten ➔</button>
                    <button id="btnReset" class="btn btn-outline">🔄 Reset</button>
                </div>
            </div>
            <pre class="code-display"><code id="sqlDisplay">
                <!-- Wird dynamisch von renderCode.js befüllt -->
            </code></pre>
        </section>

        <!-- 3. ACCORDION CONTAINER -->
        <section class="accordion-container" id="accordionContainer">
            
            <!-- Step 0: Schema -->
            <div class="accordion-card active" data-step="0">
                <div class="accordion-header">
                    <h3>0. Initialzustand (Datenbank-Schema)</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-0">
                        <p class="placeholder-text">Lade Schema...</p>
                    </div>
                </div>
            </div>

            <!-- Step 1: FROM -->
            <div class="accordion-card" data-step="1">
                <div class="accordion-header">
                    <h3>1. FROM / JOIN</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-1"></div>
                </div>
            </div>

            <!-- Step 2: WHERE -->
            <div class="accordion-card" data-step="2">
                <div class="accordion-header">
                    <h3>2. WHERE</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-2"></div>
                </div>
            </div>

            <!-- Step 3: GROUP BY -->
            <div class="accordion-card" data-step="3">
                <div class="accordion-header">
                    <h3>3. GROUP BY</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-3"></div>
                </div>
            </div>

            <!-- Step 4: HAVING -->
            <div class="accordion-card" data-step="4">
                <div class="accordion-header">
                    <h3>4. HAVING</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-4"></div>
                </div>
            </div>

            <!-- Step 5: SELECT -->
            <div class="accordion-card" data-step="5">
                <div class="accordion-header">
                    <h3>5. SELECT</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-5"></div>
                </div>
            </div>

            <!-- Step 6: ORDER BY -->
            <div class="accordion-card" data-step="6">
                <div class="accordion-header">
                    <h3>6. ORDER BY</h3>
                    <span class="status-indicator"></span>
                </div>
                <div class="accordion-body">
                    <div class="table-container" id="container-step-6"></div>
                </div>
            </div>

        </section>

    </main>

    <!-- SCRIPTS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
